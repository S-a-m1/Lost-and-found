<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Lost & Found</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <span class="logo">🔍</span>
                <span class="brand-name">Lost & Found</span>
            </div>
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html">Home</a></li>
                <li><a href="browse.html">Browse Items</a></li>
                <li><a href="post-item.html">Post Item</a></li>
                <li class="auth-section">
                    <a href="login.html" id="loginLink">Login</a>
                    <a href="profile.html" id="profileLink" style="display: none;" class="active">Profile</a>
                    <button id="logoutBtn" class="btn-logout" style="display: none;">Logout</button>
                </li>
            </ul>
        </div>
    </nav>

    <div class="profile-container">
        <div class="container">
            <div class="profile-header">
                <div class="profile-info">
                    <div class="profile-avatar" id="avatar">
                        <!-- Initial will be set by JS -->
                    </div>
                    <div class="profile-details">
                        <h2 id="userName"></h2>
                        <p style="color: var(--text-light); margin-top: 0.5rem;">
                            <span id="userEmail"></span><br>
                            <span id="userPhone"></span>
                        </p>
                        <div class="profile-stats">
                            <div class="stat">
                                <div class="stat-number" id="totalPosts">0</div>
                                <div class="stat-label">Total Posts</div>
                            </div>
                            <div class="stat">
                                <div class="stat-number" id="lostItems">0</div>
                                <div class="stat-label">Lost Items</div>
                            </div>
                            <div class="stat">
                                <div class="stat-number" id="foundItems">0</div>
                                <div class="stat-label">Found Items</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="profile-section">
                <h3>My Posted Items</h3>
                <div id="userItems" class="items-grid">
                    <!-- User items will be dynamically inserted here -->
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2024 Lost & Found. Helping reunite items with their owners.</p>
        </div>
    </footer>

    <script src="auth.js"></script>
    <script src="items.js"></script>
    <script>
        // Check if user is logged in
        if (!auth.requireAuth()) {
            // User will be redirected to login
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function loadProfile() {
            if (!auth.isLoggedIn()) return;

            const user = auth.currentUser;
            
            // Set user info
            document.getElementById('userName').textContent = user.name;
            document.getElementById('userEmail').textContent = user.email;
            document.getElementById('userPhone').textContent = user.phone;
            
            // Set avatar initial
            const initial = user.name.charAt(0).toUpperCase();
            document.getElementById('avatar').textContent = initial;

            // Get user's items
            const userItems = itemsManager.getItemsByUser(user.id);
            
            // Update stats
            document.getElementById('totalPosts').textContent = userItems.length;
            document.getElementById('lostItems').textContent = 
                userItems.filter(item => item.type === 'lost').length;
            document.getElementById('foundItems').textContent = 
                userItems.filter(item => item.type === 'found').length;

            // Render user items
            renderUserItems(userItems);
        }

        function renderUserItems(items) {
            const container = document.getElementById('userItems');
            
            if (items.length === 0) {
                container.innerHTML = `
                    <div class="no-items" style="grid-column: 1 / -1;">
                        <p>You haven't posted any items yet</p>
                        <a href="post-item.html" class="btn btn-primary">Post Your First Item</a>
                    </div>
                `;
                return;
            }

            // Sort by most recent first
            items.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

            container.innerHTML = items.map(item => `
                <div class="item-card">
                    <span class="item-badge ${item.type === 'lost' ? 'badge-lost' : 'badge-found'}">
                        ${item.type === 'lost' ? '❌ Lost' : '✅ Found'}
                    </span>
                    <h3>${escapeHtml(item.name)}</h3>
                    <div class="item-info">
                        <div class="item-info-row">
                            <span>📍</span>
                            <span>${escapeHtml(item.location)}</span>
                        </div>
                        <div class="item-info-row">
                            <span>📅</span>
                            <span>${itemsManager.formatDate(item.date)}</span>
                        </div>
                    </div>
                    <p class="item-description">${escapeHtml(item.description)}</p>
                    <div class="item-contact">
                        <strong>Contact:</strong> ${escapeHtml(item.contactInfo)}
                    </div>
                    <button class="btn btn-primary btn-full" style="margin-top: 1rem;" onclick="deleteItem('${item.id}')">
                        Delete Item
                    </button>
                </div>
            `).join('');
        }

        function deleteItem(itemId) {
            if (!confirm('Are you sure you want to delete this item?')) {
                return;
            }

            const result = itemsManager.deleteItem(itemId, auth.currentUser.id);
            
            if (result.success) {
                loadProfile(); // Reload profile to reflect changes
            } else {
                alert(result.message);
            }
        }

        // Load profile on page load
        loadProfile();
    </script>
</body>
</html>
